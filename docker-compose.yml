services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tod
      POSTGRES_PASSWORD: local_tod_password
      POSTGRES_DB: tod
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tod -d tod"]
      interval: 3s
      timeout: 3s
      retries: 20

  dynamodb:
    image: amazon/dynamodb-local:latest
    command: "-jar DynamoDBLocal.jar -inMemory -sharedDb"
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data:
